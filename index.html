<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI看盤小幫手</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; }
    .card { background: #161b22; border: 1px solid #30363d; }
    .card-header { background: #21262d; border-bottom: 1px solid #30363d; font-weight: 600; }
    .table { color: #c9d1d9; }
    .table td, .table th { border-color: #30363d; vertical-align: middle; }
    .table tbody tr:hover { background: #21262d; }
    .up   { color: #ff4d4d; font-weight: 600; }
    .down { color: #3fb950; font-weight: 600; }
    .muted { color: #6e7681; }
    .index-card { border-top: 3px solid #58a6ff; }
    .index-price { font-size: 1.6rem; font-weight: 700; }
    .news-item { border-bottom: 1px solid #30363d; padding: 10px 0; }
    .news-item:last-child { border-bottom: none; }
    .news-link { color: #58a6ff; text-decoration: none; }
    .news-link:hover { text-decoration: underline; }
    .status-bar { background: #21262d; border-radius: 8px; padding: 8px 16px; font-size: 0.85rem; }
    .rsi-high { color: #ff4d4d; }
    .rsi-low  { color: #3fb950; }
    .signal-buy  { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
    .signal-sell { background: #14532d; color: #86efac; border: 1px solid #16a34a; }
    .signal-hold { background: #1c1f26; color: #94a3b8; border: 1px solid #475569; }
    .ai-card { border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .conf-高 { opacity: 1; }
    .conf-中 { opacity: 0.8; }
    .conf-低 { opacity: 0.6; }
  </style>
</head>
<body>
<div class="container-fluid py-4 px-4">

  <!-- 標題列 -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="mb-0 fw-bold">📈 AI看盤小幫手</h4>
      <div class="muted" style="font-size:0.8rem">台股即時資料 · 自動更新</div>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div class="status-bar"><span id="last-update" class="muted">載入中...</span></div>
      <button class="btn btn-sm btn-outline-light" onclick="loadAll()">↻ 重新整理</button>
    </div>
  </div>

  <!-- 大盤指數 -->
  <h6 class="muted mb-3 text-uppercase" style="letter-spacing:1px">大盤指數</h6>
  <div class="row mb-4" id="indices-container"></div>

  <!-- 個股行情 + 技術指標（依分類） -->
  <div id="stocks-by-category"></div>

  <!-- AI 分析訊號 -->
  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between">
      <span>🤖 AI 買賣訊號分析</span>
      <span class="muted fw-normal" style="font-size:0.8rem">由 Claude AI 根據技術指標自動判斷</span>
    </div>
    <div class="card-body" id="ai-container"><div class="muted">載入中...</div></div>
  </div>

  <!-- 市場新聞 -->
  <div class="card">
    <div class="card-header">市場新聞</div>
    <div class="card-body" id="news-container"><div class="muted">載入中...</div></div>
  </div>

</div>

<script>
function qs(id) { return document.getElementById(id); }
function sign(v) { return v > 0 ? '+' : ''; }
function cls(v)  { return v > 0 ? 'up' : v < 0 ? 'down' : 'muted'; }
function rsiCls(r) { return r >= 70 ? 'rsi-high' : r <= 30 ? 'rsi-low' : ''; }

function signalBadges(s) {
  const ind = s.indicators || {};
  const badges = [];
  if (ind.RSI14 >= 70) badges.push('<span class="badge" style="background:#b91c1c">超買</span>');
  if (ind.RSI14 <= 30) badges.push('<span class="badge" style="background:#166534">超賣</span>');
  if (ind.MACD_hist > 0) badges.push('<span class="badge" style="background:#1d4ed8">MACD↑</span>');
  if (ind.MACD_hist < 0) badges.push('<span class="badge bg-secondary">MACD↓</span>');
  if (s.price && ind.MA20 && s.price > ind.MA20)
    badges.push('<span class="badge" style="background:#92400e">站MA20</span>');
  return badges.length ? badges.join(' ') : '<span class="muted">-</span>';
}

async function fetchJSON(path) {
  const res = await fetch(path + '?t=' + Date.now());
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

async function loadIndices() {
  try {
    const data = await fetchJSON('data/index/latest.json');
    qs('indices-container').innerHTML = data.map(idx => `
      <div class="col-xl-2 col-md-4 col-6 mb-3">
        <div class="card index-card h-100 p-3">
          <div class="muted small mb-1">${idx.name}</div>
          <div class="index-price ${cls(idx.change)}">${idx.price?.toLocaleString() ?? '-'}</div>
          <div class="${cls(idx.change)}">${sign(idx.change)}${idx.change ?? '-'}（${sign(idx.change_pct)}${idx.change_pct ?? '-'}%）</div>
          <div class="muted" style="font-size:0.75rem;margin-top:6px">${(idx.updated||'').slice(11,16)}</div>
        </div>
      </div>`).join('');
  } catch(e) {
    qs('indices-container').innerHTML = '<div class="col muted">資料載入失敗，請稍後再試</div>';
  }
}

function stockTableHTML(stocks) {
  const thead = `
    <thead><tr class="muted" style="font-size:0.85rem">
      <th>股票</th>
      <th class="text-end">股價</th>
      <th class="text-end">漲跌</th>
      <th class="text-end">漲幅%</th>
      <th class="text-end">MA5</th>
      <th class="text-end">MA20</th>
      <th class="text-end">RSI14</th>
      <th class="text-center">MACD</th>
      <th class="text-center">訊號</th>
    </tr></thead>`;
  const rows = stocks.map(s => {
    const ind = s.indicators || {};
    const macdDir = ind.MACD_hist > 0 ? '<span class="up">▲</span>' :
                    ind.MACD_hist < 0 ? '<span class="down">▼</span>' : '-';
    return `<tr>
      <td><div class="fw-semibold">${s.name}</div><div class="muted" style="font-size:0.78rem">${s.symbol}</div></td>
      <td class="text-end fw-bold">${s.price ?? '-'}</td>
      <td class="text-end ${cls(s.change)}">${sign(s.change)}${s.change ?? '-'}</td>
      <td class="text-end ${cls(s.change_pct)}">${sign(s.change_pct)}${s.change_pct ?? '-'}%</td>
      <td class="text-end muted">${ind.MA5 ?? '-'}</td>
      <td class="text-end muted">${ind.MA20 ?? '-'}</td>
      <td class="text-end ${rsiCls(ind.RSI14)}">${ind.RSI14 ?? '-'}</td>
      <td class="text-center">${macdDir}</td>
      <td class="text-center">${signalBadges(s)}</td>
    </tr>`;
  }).join('');
  return `<table class="table table-hover mb-0">${thead}<tbody>${rows}</tbody></table>`;
}

const CAT_ICON = {
  focus:    '⭐',
  memory:   '💾',
  passive:  '🔩',
  leo:      '🛰️',
  photonics:'💡',
  panel:    '🖥️',
  ai:       '🤖',
};

async function loadStocks() {
  try {
    const data = await fetchJSON('data/stocks/latest.json');

    // group by category
    const cats = {};
    const catOrder = [];
    data.forEach(s => {
      const cid = s.category_id || 'other';
      const cname = s.category || '其他';
      if (!cats[cid]) { cats[cid] = { name: cname, stocks: [] }; catOrder.push(cid); }
      cats[cid].stocks.push(s);
    });

    const container = qs('stocks-by-category');
    container.innerHTML = catOrder.map(cid => {
      const cat = cats[cid];
      const icon = CAT_ICON[cid] || '📊';
      return `
        <div class="card mb-3">
          <div class="card-header d-flex justify-content-between">
            <span>${icon} ${cat.name}</span>
            <span class="muted fw-normal" style="font-size:0.8rem">RSI&gt;70 超買 · RSI&lt;30 超賣</span>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">${stockTableHTML(cat.stocks)}</div>
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    qs('stocks-by-category').innerHTML = '<div class="muted p-3">資料載入失敗，請稍後再試</div>';
  }
}

async function loadNews() {
  try {
    const data = await fetchJSON('data/news/latest.json');
    const c = qs('news-container');
    if (!data.length) { c.innerHTML = '<div class="muted">暫無新聞</div>'; return; }
    c.innerHTML = data.slice(0, 15).map(n => `
      <div class="news-item">
        <a href="${n.link}" target="_blank" class="news-link">${n.title}</a>
        <div class="muted" style="font-size:0.78rem;margin-top:3px">${n.source} · ${n.time}</div>
      </div>`).join('');
  } catch(e) {
    qs('news-container').innerHTML = '<div class="muted">新聞載入失敗</div>';
  }
}

async function loadAI() {
  try {
    const data = await fetchJSON('data/ai_signals.json');
    const c = qs('ai-container');
    if (!data.length) { c.innerHTML = '<div class="muted">尚無 AI 分析資料</div>'; return; }

    const signalMap = { '買進': 'buy', '賣出': 'sell', '觀望': 'hold' };
    const confLabel = { '高': '信心高', '中': '信心中', '低': '信心低' };

    c.innerHTML = '<div class="row">' + data.map(s => {
      const cls = signalMap[s.signal] || 'hold';
      return `
        <div class="col-xl-3 col-md-4 col-sm-6 mb-2">
          <div class="ai-card signal-${cls} conf-${s.confidence}">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <strong>${s.name ?? s.symbol}</strong>
              <span class="badge" style="font-size:0.9rem">${s.signal}</span>
            </div>
            <div style="font-size:0.82rem;margin-bottom:6px">${s.reason}</div>
            <div style="font-size:0.75rem;opacity:0.7">⚠ ${s.risk}</div>
            <div class="muted" style="font-size:0.72rem;margin-top:6px">${confLabel[s.confidence] ?? ''} · ${(s.updated||'').slice(11,16)}</div>
          </div>
        </div>`;
    }).join('') + '</div>';
  } catch(e) {
    qs('ai-container').innerHTML = '<div class="muted">AI 分析資料尚未生成，請等候下次自動更新</div>';
  }
}

async function loadAll() {
  qs('last-update').textContent = '更新中...';
  await Promise.all([loadIndices(), loadStocks(), loadAI(), loadNews()]);
  qs('last-update').textContent = '最後更新：' + new Date().toLocaleString('zh-TW', { hour12: false });
}

loadAll();
setInterval(loadAll, 5 * 60 * 1000);
</script>
</body>
</html>

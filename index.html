<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AI看盤小幫手</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --bar: #21262d;
      --text: #e6edf3;
      --muted: #7d8590;
      --blue: #58a6ff;
      --up: #f85149;
      --down: #3fb950;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }

    /* 頂部 */
    .topbar { background: var(--bar); border-bottom: 1px solid var(--border);
      padding: 12px 20px; position: sticky; top: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center; }

    /* 大盤 */
    .idx-card { background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 20px; }
    .idx-price { font-size: 1.6rem; font-weight: 700; }

    /* 分類標題 */
    .cat-title { background: var(--bar); border: 1px solid var(--border);
      border-radius: 12px 12px 0 0; padding: 12px 18px; font-weight: 600; font-size: 0.95rem; }
    .cat-body { border: 1px solid var(--border); border-top: none;
      border-radius: 0 0 12px 12px; padding: 14px; margin-bottom: 22px; }

    /* 個股卡片 */
    .sk { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; height: 100%; transition: transform .15s, border-color .15s; }
    .sk:hover { transform: translateY(-2px); border-color: var(--blue); }
    .sk.buy  { border-left: 4px solid var(--up); }
    .sk.sell { border-left: 4px solid var(--down); }
    .sk.hold { border-left: 4px solid #444c56; }

    /* 訊號標籤 */
    .sig { font-size: 0.8rem; font-weight: 700; padding: 4px 11px;
      border-radius: 20px; letter-spacing: .5px; white-space: nowrap; }
    .sig-strong-buy  { background: #5c0000; border: 2px solid #ff4d4d; color: #ffb3b3; }
    .sig-buy         { background: #3d0000; border: 1px solid var(--up);  color: #ff9492; }
    .sig-hold        { background: #1c2128; border: 1px solid #444c56;    color: #768390; }
    .sig-sell        { background: #0d2818; border: 1px solid var(--down); color: #56d364; }
    .sig-strong-sell { background: #002810; border: 2px solid #3fb950;    color: #9effa6; }

    /* RSI 條 */
    .rsi-wrap { background: #2d333b; border-radius: 4px; height: 5px; margin: 6px 0; overflow: hidden; }
    .rsi-fill { height: 100%; border-radius: 4px; }

    /* AI 說明 */
    .ai-note { font-size: 0.76rem; color: #adbac7; line-height: 1.5; margin-top: 9px;
      border-top: 1px solid var(--border); padding-top: 9px; }

    /* 新聞 */
    .news-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
    .news-row  { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .news-row:last-child { border-bottom: none; }
    .news-a { color: var(--blue); text-decoration: none; font-size: 0.86rem; }
    .news-a:hover { text-decoration: underline; }

    .up    { color: var(--up); }
    .down  { color: var(--down); }
    .muted { color: var(--muted); }
    .sec   { font-size: .75rem; font-weight: 600; color: var(--muted);
             text-transform: uppercase; letter-spacing: 1.5px; margin: 22px 0 10px; }
  </style>
</head>
<body>

<!-- 頂部導覽 -->
<div class="topbar">
  <div>
    <span style="font-size:1.05rem;font-weight:700">📈 AI看盤小幫手</span>
    <span class="muted" style="font-size:.78rem;margin-left:10px">台股即時追蹤</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <span class="muted" style="font-size:.8rem" id="last-update">載入中...</span>
    <button class="btn btn-sm btn-outline-secondary" onclick="loadAll()">↻ 刷新</button>
  </div>
</div>

<div class="container-fluid py-3 px-3">

  <!-- 大盤 -->
  <div class="sec">大盤指數</div>
  <div class="row g-3 mb-1" id="indices-container"></div>

  <!-- 個股 -->
  <div class="sec">個股看盤</div>
  <div id="stocks-by-category"></div>

  <!-- 新聞 -->
  <div class="sec">市場新聞</div>
  <div class="news-wrap" id="news-container">
    <div class="news-row muted">載入中...</div>
  </div>
  <div style="height:32px"></div>

</div>

<script>
const CAT_ICON = {
  focus:'⭐', memory:'💾', passive:'🔩',
  leo:'🛰️', photonics:'💡', panel:'🖥️', ai:'🤖',
};

const qs = id => document.getElementById(id);
const sign = v => v > 0 ? '+' : '';

async function fetchJSON(path) {
  const res = await fetch(path + '?t=' + Date.now());
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

function rsiColor(r) {
  if (r >= 70) return '#f85149';
  if (r <= 30) return '#3fb950';
  return '#58a6ff';
}

function sigConfig(signal) {
  const m = {
    '強力買入': { cls:'strong-buy',  icon:'🔥 強力買入', border:'#ff4d4d' },
    '買入':     { cls:'buy',         icon:'▲ 買入',      border:'#f85149' },
    '觀望':     { cls:'hold',        icon:'— 觀望',      border:'#444c56' },
    '賣出':     { cls:'sell',        icon:'▼ 賣出',      border:'#3fb950' },
    '強力賣出': { cls:'strong-sell', icon:'❄️ 強力賣出', border:'#3fb950' },
  };
  return m[signal] || m['觀望'];
}

function stockCard(s, aiMap) {
  const ind = s.indicators || {};
  const ai  = aiMap[s.symbol] || null;

  // 優先用 rule-based signal（永遠有），AI reason 當補充
  const signal = s.signal ?? '觀望';
  const sc     = sigConfig(signal);

  const pct    = s.change_pct ?? 0;
  const chgCls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'muted';

  const trend = s.trend ?? '盤整';
  const tIcon = trend === '上升' ? '📈' : trend === '下降' ? '📉' : '➡️';

  const rsi  = ind.RSI14 ?? 50;
  const rsiW = Math.min(100, Math.max(0, rsi));
  const rsiC = rsiColor(rsi);

  // 顯示 rule-based 理由，或 AI 理由（如有）
  const reason = ai?.reason || s.signal_reason || '';
  const risk   = ai?.risk   || '';

  return `
    <div class="col-xl-3 col-lg-4 col-md-6 col-6 mb-3">
      <div class="sk ${sc.cls}" style="border-left-color:${sc.border}">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <div>
            <div style="font-weight:700;font-size:.95rem">${s.name}</div>
            <div class="muted" style="font-size:.7rem">${s.symbol}</div>
          </div>
          <span class="sig sig-${sc.cls}">${sc.icon}</span>
        </div>

        <div class="d-flex align-items-baseline gap-2 mb-1">
          <span style="font-size:1.25rem;font-weight:700">${s.price?.toLocaleString() ?? '-'}</span>
          <span class="${chgCls}" style="font-size:.85rem">${sign(pct)}${pct}%</span>
        </div>

        <div class="muted" style="font-size:.73rem;margin-bottom:3px">
          ${tIcon} ${trend} &nbsp;·&nbsp; RSI ${rsi} &nbsp;·&nbsp; MA20 ${ind.MA20 ?? '-'}
        </div>

        <div class="rsi-wrap">
          <div class="rsi-fill" style="width:${rsiW}%;background:${rsiC}"></div>
        </div>

        <div class="ai-note">
          ${reason}
          ${risk ? `<br><span style="opacity:.6">⚠ ${risk}</span>` : ''}
        </div>
      </div>
    </div>`;
}

async function loadIndices() {
  try {
    const data = await fetchJSON('data/index/latest.json');
    qs('indices-container').innerHTML = data.map(idx => {
      const c = (idx.change ?? 0) > 0 ? 'up' : (idx.change ?? 0) < 0 ? 'down' : 'muted';
      return `
        <div class="col-xl-2 col-md-4 col-6">
          <div class="idx-card">
            <div class="muted mb-1" style="font-size:.76rem">${idx.name}</div>
            <div class="idx-price ${c}">${idx.price?.toLocaleString() ?? '-'}</div>
            <div class="${c}" style="font-size:.84rem">
              ${sign(idx.change)}${idx.change ?? '-'}（${sign(idx.change_pct)}${idx.change_pct ?? '-'}%）
            </div>
            <div class="muted" style="font-size:.7rem;margin-top:4px">${(idx.updated||'').slice(11,16)} 更新</div>
          </div>
        </div>`;
    }).join('');
  } catch {
    qs('indices-container').innerHTML = '<div class="col muted">大盤資料載入失敗</div>';
  }
}

async function loadStocks() {
  try {
    const [stocks, aiRaw] = await Promise.all([
      fetchJSON('data/stocks/latest.json'),
      fetchJSON('data/ai_signals.json').catch(() => []),  // AI 補充說明，無則略過
    ]);

    const aiMap = {};
    aiRaw.forEach(a => { aiMap[a.symbol] = a; });

    const cats = {}, order = [];
    stocks.forEach(s => {
      const cid = s.category_id || 'other', cn = s.category || '其他';
      if (!cats[cid]) { cats[cid] = { name: cn, stocks: [] }; order.push(cid); }
      cats[cid].stocks.push(s);
    });

    qs('stocks-by-category').innerHTML = order.map(cid => {
      const cat = cats[cid], icon = CAT_ICON[cid] || '📊';
      return `
        <div class="cat-title">${icon} ${cat.name}
          <span class="muted" style="font-weight:400;font-size:.78rem">（${cat.stocks.length} 檔）</span>
        </div>
        <div class="cat-body">
          <div class="row g-2">${cat.stocks.map(s => stockCard(s, aiMap)).join('')}</div>
        </div>`;
    }).join('');
  } catch {
    qs('stocks-by-category').innerHTML = '<div class="muted p-3">個股資料載入失敗</div>';
  }
}

async function loadNews() {
  try {
    const data = await fetchJSON('data/news/latest.json');
    const c = qs('news-container');
    if (!data.length) { c.innerHTML = '<div class="news-row muted">暫無新聞</div>'; return; }
    c.innerHTML = data.slice(0, 12).map(n => `
      <div class="news-row">
        <a href="${n.link}" target="_blank" class="news-a">${n.title}</a>
        <div class="muted" style="font-size:.71rem;margin-top:3px">${n.source} · ${n.time}</div>
      </div>`).join('');
  } catch {
    qs('news-container').innerHTML = '<div class="news-row muted">新聞載入失敗</div>';
  }
}

async function loadAll() {
  qs('last-update').textContent = '更新中...';
  await Promise.all([loadIndices(), loadStocks(), loadNews()]);
  qs('last-update').textContent = '更新：' + new Date().toLocaleTimeString('zh-TW', { hour12: false });
}

loadAll();
setInterval(loadAll, 5 * 60 * 1000);
</script>
</body>
</html>

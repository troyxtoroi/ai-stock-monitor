<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AI軍師 · 股市孔明</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
  :root {
    --bg:     #0b0c11;
    --bg2:    #11131a;
    --card:   #15172000;
    --surf:   #191c26;
    --bord:   #1f2235;
    --bord2:  #2c3050;
    --text:   #ddd8cf;
    --text2:  #9994a0;
    --muted:  #4e5068;
    --gold:   #c9a84c;
    --up:     #e05c5c;
    --down:   #4db86a;
    --blue:   #6b97cc;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding-bottom: 46px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Topbar ───────────────────────────────────────────────────── */
  .topbar {
    background: rgba(15,16,22,.96);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--bord);
    height: 52px;
    padding: 0 24px;
    position: sticky; top: 0; z-index: 200;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-brand { font-size: .9rem; font-weight: 700; letter-spacing: -.2px; }
  .topbar-brand em { color: var(--gold); font-style: normal; }
  .topbar-sub { font-size: .68rem; color: var(--muted); margin-left: 10px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }

  #live-badge {
    display: none; font-size: .66rem; font-weight: 600; padding: 3px 10px; border-radius: 20px;
    background: rgba(77,184,106,.1); color: #5cc97a; border: 1px solid rgba(77,184,106,.22); letter-spacing: .3px;
  }
  #closed-badge {
    display: none; font-size: .66rem; padding: 3px 10px; border-radius: 20px;
    background: rgba(255,255,255,.03); color: var(--muted); border: 1px solid var(--bord);
  }
  #last-update { font-size: .72rem; color: var(--muted); }
  .btn-ref {
    font-size: .7rem; padding: 4px 13px; border-radius: 20px; cursor: pointer;
    background: transparent; color: var(--text2); border: 1px solid var(--bord2); transition: all .15s;
  }
  .btn-ref:hover { background: var(--surf); color: var(--text); }

  /* ── Layout ───────────────────────────────────────────────────── */
  .wrap { padding: 22px 20px 0; max-width: 1600px; margin: 0 auto; }
  .sec {
    font-size: .63rem; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 2px; margin: 28px 0 14px;
  }

  /* ── Index Cards ──────────────────────────────────────────────── */
  .idx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 10px; }
  .idx-card {
    background: #16192200;
    background: linear-gradient(145deg, #191c28, #13151e);
    border: 1px solid var(--bord);
    border-radius: 16px; padding: 18px 20px; position: relative; overflow: hidden;
  }
  .idx-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--gold) 0%, transparent 70%);
  }
  .idx-name  { font-size: .67rem; color: var(--muted); letter-spacing: .5px; margin-bottom: 8px; }
  .idx-price { font-size: 1.85rem; font-weight: 900; letter-spacing: -1.5px; line-height: 1; font-variant-numeric: tabular-nums; }
  .idx-chg   { font-size: .85rem; font-weight: 600; margin-top: 5px; }
  .idx-time  { font-size: .62rem; color: var(--muted); margin-top: 8px; }

  /* ── Category ─────────────────────────────────────────────────── */
  .cat-wrap { margin-bottom: 30px; }
  .cat-head {
    display: flex; align-items: center; gap: 9px; margin-bottom: 12px;
  }
  .cat-icon { font-size: .95rem; }
  .cat-name { font-size: .82rem; font-weight: 600; color: var(--text); }
  .cat-count { font-size: .67rem; color: var(--muted); }
  .cat-rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--bord), transparent); }
  .cat-ai { font-size: .62rem; padding: 2px 8px; border-radius: 10px;
    background: rgba(201,168,76,.08); color: var(--gold); border: 1px solid rgba(201,168,76,.18); }

  /* ── Stock Grid ────────────────────────────────────────────────── */
  .sk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px,1fr)); gap: 10px; }
  @media (max-width:600px) { .sk-grid { grid-template-columns: repeat(2,1fr); gap: 8px; } }

  .sk {
    background: linear-gradient(160deg, #161820, #111319);
    border: 1px solid var(--bord);
    border-radius: 14px; padding: 15px;
    cursor: pointer; position: relative; overflow: hidden;
    transition: transform .15s, border-color .2s, box-shadow .2s;
  }
  .sk::before {
    content: ''; position: absolute; left: 0; top: 16px; bottom: 16px;
    width: 3px; border-radius: 0 2px 2px 0; background: var(--bord2);
    transition: background .15s;
  }
  .sk:hover { transform: translateY(-2px); border-color: var(--bord2); box-shadow: 0 12px 32px rgba(0,0,0,.4); }
  .sk.sell::before      { background: #c84444; }
  .sk.lean-sell::before { background: #c47030; }
  .sk.neutral::before   { background: var(--bord2); }
  .sk.lean-buy::before  { background: #4a7ecc; }
  .sk.hold::before      { background: #45a860; }
  .sk.nodata            { opacity: .45; cursor: default; }
  .sk.nodata:hover      { transform: none; box-shadow: none; }
  .sk.is-holding        { border-color: rgba(201,168,76,.28) !important; box-shadow: 0 0 0 1px rgba(201,168,76,.08); }
  .sk.is-holding::before { background: var(--gold) !important; }

  /* Holding strip */
  .holding-strip {
    display: flex; align-items: center; gap: 5px;
    background: rgba(201,168,76,.06); border: 1px solid rgba(201,168,76,.15);
    border-radius: 6px; padding: 4px 10px; margin-bottom: 10px;
    font-size: .63rem; font-weight: 700; color: var(--gold); letter-spacing: 1px;
  }

  /* Card header */
  .sk-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .sk-name { font-size: .9rem; font-weight: 700; }
  .sk-code { font-size: .62rem; color: var(--muted); margin-top: 2px; }

  /* Signal */
  .sig-wrap { text-align: right; flex-shrink: 0; margin-left: 8px; }
  .sig-icon { font-size: 1.2rem; line-height: 1; }
  .sig-badge {
    font-size: .62rem; font-weight: 700; padding: 2px 8px; border-radius: 10px;
    white-space: nowrap; display: inline-block; margin-top: 3px; letter-spacing: .2px;
  }
  .sig-sell      { background: rgba(200,68,68,.14);  color: #e07272; border: 1px solid rgba(200,68,68,.28); }
  .sig-lean-sell { background: rgba(196,112,48,.12); color: #d89060; border: 1px solid rgba(196,112,48,.25); }
  .sig-neutral   { background: rgba(80,85,110,.1);   color: #787e96; border: 1px solid rgba(80,85,110,.2); }
  .sig-lean-buy  { background: rgba(74,126,204,.12); color: #78aee0; border: 1px solid rgba(74,126,204,.24); }
  .sig-hold      { background: rgba(69,168,96,.14);  color: #68ca86; border: 1px solid rgba(69,168,96,.28); }

  /* Meta row */
  .sk-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .pos-badge { font-size: .6rem; font-weight: 600; padding: 2px 7px; border-radius: 7px; }
  .pos-高點 { background: rgba(200,68,68,.1);  color: #d97070; }
  .pos-偏高 { background: rgba(196,112,48,.08); color: #cc8855; }
  .pos-中間 { background: rgba(80,85,110,.1);  color: #787e96; }
  .pos-偏低 { background: rgba(74,126,204,.1); color: #78aee0; }
  .pos-低點 { background: rgba(74,126,204,.14);color: #78aee0; }
  .pos-不明 { background: rgba(80,85,110,.07); color: var(--muted); }
  .trend-tag { font-size: .62rem; color: var(--muted); }

  /* Price */
  .sk-price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; }
  .sk-price { font-size: 1.6rem; font-weight: 900; letter-spacing: -1px; line-height: 1; font-variant-numeric: tabular-nums; }
  .sk-chg   { font-size: .88rem; font-weight: 600; }

  /* Indicators */
  .sk-ind { margin-bottom: 9px; }
  .sk-ind-row { display: flex; justify-content: space-between; font-size: .62rem; color: var(--muted); margin-bottom: 3px; }
  .rsi-track { background: #1c1f2e; border-radius: 2px; height: 3px; overflow: hidden; }
  .rsi-fill  { height: 100%; border-radius: 2px; transition: width .3s; }

  /* Rule note */
  .rule-note { font-size: .65rem; color: #444660; line-height: 1.55; padding-top: 8px;
    border-top: 1px solid var(--bord); margin-top: 8px; }

  /* AI block */
  .ai-block {
    background: rgba(25,28,40,.7); border: 1px solid #242840;
    border-radius: 10px; padding: 10px 12px; margin-top: 8px;
  }
  .ai-block-title { font-size: .6rem; font-weight: 700; color: var(--gold);
    letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 6px; }
  .ai-badges { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; flex-wrap: wrap; }
  .ai-badge { font-size: .6rem; font-weight: 700; padding: 2px 7px; border-radius: 8px; }
  .ai-buy   { background: rgba(69,168,96,.12);  color: #6aca88; border: 1px solid rgba(69,168,96,.22); }
  .ai-sell  { background: rgba(200,68,68,.12);  color: #e07272; border: 1px solid rgba(200,68,68,.22); }
  .ai-watch { background: rgba(80,85,110,.1);   color: #787e96; border: 1px solid rgba(80,85,110,.2); }
  .ai-conf-高 { background: rgba(201,168,76,.1);  color: var(--gold); border: 1px solid rgba(201,168,76,.2); }
  .ai-conf-中 { background: rgba(80,85,110,.08);  color: #787e96;    border: 1px solid rgba(80,85,110,.15); }
  .ai-conf-低 { background: rgba(196,112,48,.08); color: #c47030;    border: 1px solid rgba(196,112,48,.15); }
  .ai-reason { font-size: .66rem; color: #7a8098; line-height: 1.55; }
  .ai-risk   { font-size: .63rem; color: #50526a; margin-top: 3px; }

  /* Stock news */
  .stock-news { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--bord); }
  .news-row-item { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 5px; }
  .news-row-item:last-child { margin-bottom: 0; }
  .tag-bull { flex-shrink:0; font-size:.58rem; font-weight:700; padding:1px 6px; border-radius:4px;
    background:rgba(69,168,96,.1); color:#68ca86; border:1px solid rgba(69,168,96,.18); }
  .tag-bear { flex-shrink:0; font-size:.58rem; font-weight:700; padding:1px 6px; border-radius:4px;
    background:rgba(200,68,68,.1); color:#e07272; border:1px solid rgba(200,68,68,.18); }
  .tag-neut { flex-shrink:0; font-size:.58rem; font-weight:700; padding:1px 6px; border-radius:4px;
    background:rgba(80,85,110,.08); color:#606278; border:1px solid rgba(80,85,110,.14); }
  .news-title-sm { font-size:.65rem; color:#666880; line-height:1.45;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    text-decoration:none; }
  .news-title-sm:hover { color: var(--blue); }
  .news-src-sm { font-size:.58rem; color: var(--muted); margin-top:1px; }

  /* ── News Section ──────────────────────────────────────────────── */
  .news-section { background: linear-gradient(160deg,#161820,#111319); border: 1px solid var(--bord); border-radius: 14px; overflow: hidden; }
  .news-row { padding: 12px 18px; border-bottom: 1px solid var(--bord); transition: background .1s; }
  .news-row:last-child { border-bottom: none; }
  .news-row:hover { background: #161a24; }
  .news-a { color: var(--text2); text-decoration: none; font-size: .8rem; line-height: 1.5; }
  .news-a:hover { color: var(--blue); }
  .news-meta { font-size: .62rem; color: var(--muted); margin-top: 3px; }

  /* ── Ticker ────────────────────────────────────────────────────── */
  .ticker-bar {
    position:fixed; bottom:0; left:0; right:0; height:38px;
    background: rgba(9,10,15,.97); backdrop-filter: blur(10px);
    border-top: 1px solid var(--bord); overflow:hidden; z-index:500;
    display:flex; align-items:center;
  }
  .ticker-label {
    flex-shrink:0; padding:0 14px;
    font-size:.62rem; font-weight:700; color:var(--gold);
    letter-spacing:1.2px; text-transform:uppercase;
    border-right:1px solid var(--bord); height:100%;
    display:flex; align-items:center;
  }
  .ticker-viewport { flex:1; overflow:hidden; height:100%; }
  .ticker-track { display:inline-flex; align-items:center; height:100%; white-space:nowrap; will-change:transform; }
  .ticker-item {
    display:inline-flex; align-items:center; gap:6px;
    padding:0 18px; font-size:.76rem;
    border-right:1px solid #181a26; cursor:pointer; transition:background .1s;
  }
  .ticker-item:hover { background:#111420; }
  .ticker-name  { color:var(--muted); font-size:.68rem; }
  .ticker-price { font-weight:700; font-variant-numeric:tabular-nums; }
  .ticker-chg   { font-size:.68rem; }

  @keyframes flash-up   { 0%{background:rgba(224,92,92,.22)}  100%{background:transparent} }
  @keyframes flash-down { 0%{background:rgba(77,184,106,.22)} 100%{background:transparent} }
  .flash-up   { animation:flash-up   .5s ease-out; border-radius:4px; }
  .flash-down { animation:flash-down .5s ease-out; border-radius:4px; }

  /* ── Chart Modal ───────────────────────────────────────────────── */
  #chart-modal { display:none; position:fixed; inset:0; background:#0a0b10; z-index:2000; flex-direction:column; }
  #chart-modal.open { display:flex; }
  .chart-topbar {
    background:#111420; border-bottom:1px solid var(--bord);
    padding:10px 18px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0;
  }
  .chart-ttl { font-weight:700; font-size:.98rem; }
  .chart-prc { font-size:.78rem; color:var(--muted); margin-left:8px; }
  .chart-legend {
    background:#111420; border-bottom:1px solid var(--bord);
    padding:5px 18px; font-size:.66rem; display:flex; gap:16px; flex-wrap:wrap; flex-shrink:0; color:var(--muted);
  }
  #main-chart-wrap { flex:1; min-height:0; }
  .kd-label {
    background:#111420; border-top:1px solid var(--bord);
    padding:5px 18px; font-size:.66rem; display:flex; gap:14px; flex-shrink:0; color:var(--muted);
  }
  #kd-chart-wrap { height:110px; flex-shrink:0; }

  .btn-period {
    font-size:.7rem; padding:4px 14px; border-radius:16px; cursor:pointer;
    background:transparent; color:var(--text2); border:1px solid var(--bord2); transition:all .15s;
  }
  .btn-period.active { background:var(--gold); color:#0b0c11; border-color:var(--gold); font-weight:700; }
  .btn-close-chart {
    font-size:.7rem; padding:4px 14px; border-radius:16px; cursor:pointer; margin-left:8px;
    background:rgba(200,68,68,.1); color:#e07272; border:1px solid rgba(200,68,68,.25);
  }

  /* Utilities */
  .up { color:var(--up); } .down { color:var(--down); } .muted { color:var(--muted); }
  </style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center">
    <span class="topbar-brand">🪖 <em>AI軍師</em> 股市孔明</span>
    <span class="topbar-sub">點擊個股查看 K 線圖</span>
  </div>
  <div class="topbar-right">
    <span id="live-badge">● 即時</span>
    <span id="closed-badge">○ 收盤</span>
    <span id="last-update" class="muted">載入中…</span>
    <button class="btn-ref" onclick="loadAll()">↻ 刷新</button>
  </div>
</div>

<div class="wrap">
  <div class="sec">大盤指數</div>
  <div class="idx-grid" id="indices-container"></div>

  <div class="sec">個股戰情</div>
  <div id="stocks-by-category"></div>

  <div class="sec">市場新聞</div>
  <div class="news-section" id="news-container">
    <div class="news-row muted" style="font-size:.8rem">載入中…</div>
  </div>
  <div style="height:28px"></div>
</div>

<!-- Ticker -->
<div class="ticker-bar" id="ticker-bar">
  <div class="ticker-label">行情</div>
  <div class="ticker-viewport" id="ticker-viewport">
    <div class="ticker-track" id="ticker-track">
      <span style="color:var(--muted);font-size:.78rem;padding:0 20px">資料載入中…</span>
    </div>
  </div>
</div>

<!-- Chart Modal -->
<div id="chart-modal">
  <div class="chart-topbar">
    <div>
      <span class="chart-ttl" id="chart-title">—</span>
      <span class="chart-prc" id="chart-price"></span>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <button id="btn-daily"  class="btn-period active" onclick="switchPeriod('daily')">日線</button>
      <button id="btn-weekly" class="btn-period"        onclick="switchPeriod('weekly')">週線</button>
      <button class="btn-close-chart" onclick="closeChart()">✕ 關閉</button>
    </div>
  </div>
  <div class="chart-legend">
    <span><span style="color:#ff9d00">━</span> MA5</span>
    <span><span style="color:#f5d020">━</span> MA10</span>
    <span><span style="color:#6b97cc">━</span> MA20</span>
    <span><span style="color:#9b8fcc">━</span> MA60</span>
    <span><span style="color:#3a4060">╌╌</span> 布林通道</span>
    <span><span style="color:#c9a84c">▲</span> 黃金交叉</span>
    <span><span style="color:#4e5068">▼</span> 死亡交叉</span>
  </div>
  <div id="main-chart-wrap"></div>
  <div class="kd-label">
    <span>KD 指標</span>
    <span><span style="color:#6b97cc">━</span> K值</span>
    <span><span style="color:#c9a84c">━</span> D值</span>
    <span>超買 &gt;80 ／ 超賣 &lt;20</span>
  </div>
  <div id="kd-chart-wrap"></div>
</div>

<script>
const CAT_ICON = { focus:'⭐', memory:'💾', passive:'🔩', leo:'🛰️', photonics:'💡', panel:'🖥️', ai:'🤖' };
const qs   = id => document.getElementById(id);
const sign = v  => v > 0 ? '+' : '';

async function fetchJSON(path) {
  const r = await fetch(path + '?t=' + Date.now());
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

/* ── 前端訊號計算 ───────────────────────────────────────────────── */
function computeSignalJS(price, ind) {
  if (!price || !ind || !Object.keys(ind).length)
    return { signal:'中性觀望', position:'不明', trend:'盤整', strength:0, reason:'資料不足' };
  const rsi=ind.RSI14??50, hist=ind.MACD_hist??0, ma5=ind.MA5, ma20=ind.MA20;
  const bbU=ind.BB_upper, bbL=ind.BB_lower;
  const aboveBB=bbU&&price>=bbU, belowBB=bbL&&price<=bbL;
  let position;
  if      (rsi>=75||aboveBB)                     position='高點';
  else if (rsi<=28||belowBB)                     position='低點';
  else if (rsi>=60&&ma20&&price>ma20*1.05)       position='偏高';
  else if (rsi<=40&&ma20&&price<ma20*0.95)       position='偏低';
  else                                            position='中間';
  let trend='盤整';
  if (ma5&&ma20){ if(ma5>ma20*1.015) trend='上升'; else if(ma5<ma20*0.985) trend='下降'; }
  let score=0;
  if(rsi<30)score+=3; else if(rsi<45)score+=1; else if(rsi>70)score-=3; else if(rsi>58)score-=1;
  if(hist>0)score+=2; else if(hist<0)score-=2;
  if(ma20) score+= price>ma20?1:-1;
  if(aboveBB)score-=2; if(belowBB)score+=2;
  let signal;
  if     (position==='高點'||score<=-4)                   signal='賣出';
  else if(score<=-2||(position==='偏高'&&score<0))        signal='偏賣觀望';
  else if(position==='低點'||score>=4)                    signal='抱緊';
  else if(score>=2||(position==='偏低'&&score>0))         signal='偏買觀望';
  else                                                     signal='中性觀望';
  const p=[];
  p.push(`RSI ${rsi}`);
  if(aboveBB)p.push('突破布林上軌');else if(belowBB)p.push('跌破布林下軌');
  if(hist>0)p.push('MACD金叉');else if(hist<0)p.push('MACD死叉');
  if(ma20)p.push(`${price>ma20?'站上':'跌破'} MA20(${ma20})`);
  return {signal,position,trend,strength:score,reason:p.join('，')};
}

/* ── 訊號設定 ─────────────────────────────────────────────────── */
function sigConfig(sig) {
  const m={
    '賣出':    {cls:'sell',      icon:'💰',label:'賣出',     desc:'明確高點，建議獲利了結'},
    '偏賣觀望':{cls:'lean-sell', icon:'⚠️',label:'偏賣觀望', desc:'有賣壓，留意風險'},
    '中性觀望':{cls:'neutral',   icon:'👀',label:'觀望',     desc:'方向不明，等待訊號'},
    '偏買觀望':{cls:'lean-buy',  icon:'📌',label:'偏買觀望', desc:'偏多訊號，可分批試單'},
    '抱緊':    {cls:'hold',      icon:'💪',label:'抱緊/買進', desc:'強烈多訊號，持有或進場'},
  };
  return m[sig]||m['中性觀望'];
}
function posLabel(p) {
  return {'高點':'🔴 高點','偏高':'🟠 偏高','中間':'⚪ 中間','偏低':'🔵 偏低','低點':'🔵 低點','不明':'— 不明'}[p]||p;
}
function rsiColor(r){ return r>=70?'var(--up)':r<=30?'var(--down)':'var(--blue)'; }

/* ── AI 區塊 ─────────────────────────────────────────────────── */
function aiBlock(ai) {
  if (!ai) return '';
  const sMap={'買入':'ai-buy','賣出':'ai-sell','觀望':'ai-watch'};
  return `<div class="ai-block">
    <div class="ai-block-title">🤖 AI 建議</div>
    <div class="ai-badges">
      <span class="ai-badge ${sMap[ai.signal]||'ai-watch'}">${ai.signal||'觀望'}</span>
      <span class="ai-badge ai-conf-${ai.confidence||'中'}">信心 ${ai.confidence||'中'}</span>
      ${ai.trend?`<span style="font-size:.62rem;color:var(--muted)">${ai.trend==='上升'?'📈':ai.trend==='下降'?'📉':'➡️'} ${ai.trend}</span>`:''}
    </div>
    ${ai.reason?`<div class="ai-reason">${ai.reason}</div>`:''}
    ${ai.risk  ?`<div class="ai-risk">⚠ ${ai.risk}</div>`:''}
  </div>`;
}

/* ── 消息區塊 ─────────────────────────────────────────────────── */
function newsBlock(items) {
  if (!items||!items.length) return '';
  const tc={'利多':'tag-bull','利空':'tag-bear','中性':'tag-neut'};
  return `<div class="stock-news">`+items.slice(0,2).map(n=>`
    <div class="news-row-item">
      <span class="${tc[n.sentiment]||'tag-neut'}">${n.sentiment}</span>
      <div>
        <a href="${n.link}" target="_blank" class="news-title-sm" onclick="event.stopPropagation()">${n.title}</a>
        <div class="news-src-sm">${n.source} · ${n.time}</div>
      </div>
    </div>`).join('')+`</div>`;
}

/* ── 個股卡片 ─────────────────────────────────────────────────── */
function stockCard(s, aiMap, newsMap, holdings) {
  if (s.price===null||s.price===undefined) {
    return `<div class="sk nodata" style="padding:16px">
      <div class="sk-name">${s.name}</div>
      <div class="sk-code">${s.symbol}</div>
      <div class="nodata-msg" style="margin-top:10px;font-size:.72rem;color:var(--muted)">資料暫無法取得</div>
    </div>`;
  }
  const ind      = s.indicators||{};
  const ai       = aiMap[s.symbol]||null;
  const newsItems= (newsMap||{})[s.symbol]||[];
  const shares   = (holdings||{})[s.symbol]||0;
  const computed = s.signal
    ? {signal:s.signal,position:s.position,trend:s.trend,strength:s.strength,reason:s.signal_reason}
    : computeSignalJS(s.price,ind);
  const sc   = sigConfig(computed.signal);
  const pos  = computed.position||'不明';
  const trend= computed.trend   ||'盤整';
  const tIcon= trend==='上升'?'📈':trend==='下降'?'📉':'➡️';
  const pct  = s.change_pct??0;
  const cls  = pct>0?'up':pct<0?'down':'muted';
  const rsi  = ind.RSI14??'-';
  const rsiW = typeof rsi==='number'?Math.min(100,Math.max(0,rsi)):50;

  return `<div class="sk ${sc.cls}${shares?' is-holding':''}" onclick="openChart('${s.symbol}','${s.name}',${s.price??0})">
    ${shares?`<div class="holding-strip"><span>◆</span><span>持股中</span></div>`:''}
    <div class="sk-head">
      <div>
        <div class="sk-name">${s.name}</div>
        <div class="sk-code">${s.symbol}</div>
      </div>
      <div class="sig-wrap">
        <div class="sig-icon">${sc.icon}</div>
        <div class="sig-badge sig-${sc.cls}">${sc.label}</div>
      </div>
    </div>
    <div class="sk-meta">
      <span class="pos-badge pos-${pos}">${posLabel(pos)}</span>
      <span class="trend-tag">${tIcon} ${trend}</span>
    </div>
    <div class="sk-price-row">
      <span class="${cls} sk-price" data-price="${s.symbol}">${s.price?.toLocaleString()??'—'}</span>
      <span class="${cls} sk-chg"   data-chg="${s.symbol}">${sign(pct)}${pct}%</span>
    </div>
    <div class="sk-ind">
      <div class="sk-ind-row">
        <span>RSI ${rsi}</span>
        <span>MA20 ${ind.MA20??'—'} &nbsp;·&nbsp; MACD ${ind.MACD_hist!=null?(ind.MACD_hist>0?'↑':'↓'):'—'}</span>
      </div>
      <div class="rsi-track"><div class="rsi-fill" style="width:${rsiW}%;background:${rsiColor(rsi)}"></div></div>
    </div>
    <div class="rule-note">${sc.desc}${computed.reason?' · '+computed.reason:''}</div>
    ${aiBlock(ai)}
    ${newsBlock(newsItems)}
  </div>`;
}

/* ── 資料載入 ─────────────────────────────────────────────────── */
async function loadIndices() {
  try {
    const data = await fetchJSON('data/index/latest.json');
    qs('indices-container').innerHTML = data.map(idx => {
      const c=(idx.change??0)>0?'up':(idx.change??0)<0?'down':'muted';
      return `<div class="idx-card">
        <div class="idx-name">${idx.name}</div>
        <div class="idx-price ${c}" data-price="${idx.symbol}">${idx.price?.toLocaleString()??'—'}</div>
        <div class="idx-chg ${c}"   data-chg="${idx.symbol}">${sign(idx.change)}${idx.change??'—'}（${sign(idx.change_pct)}${idx.change_pct??'—'}%）</div>
        <div class="idx-time">${(idx.updated||'').slice(11,16)} 更新</div>
      </div>`;
    }).join('');
  } catch { qs('indices-container').innerHTML='<div class="muted">大盤資料載入失敗</div>'; }
}

async function loadStocks() {
  try {
    const [stocks, aiRaw, newsRaw, watchlist] = await Promise.all([
      fetchJSON('data/stocks/latest.json'),
      fetchJSON('data/ai_signals.json').catch(()=>[]),
      fetchJSON('data/news/stocks_news.json').catch(()=>({})),
      fetchJSON('config/watchlist.json').catch(()=>({})),
    ]);
    const aiMap   = {};  aiRaw.forEach(a=>{ aiMap[a.symbol]=a; });
    const holdings= watchlist.holdings||{};
    const hasAI   = aiRaw.length>0;
    const cats={}, order=[];
    stocks.forEach(s=>{
      const cid=s.category_id||'other', cn=s.category||'其他';
      if(!cats[cid]){cats[cid]={name:cn,stocks:[]}; order.push(cid);}
      cats[cid].stocks.push(s);
    });
    qs('stocks-by-category').innerHTML = order.map(cid=>{
      const cat=cats[cid], icon=CAT_ICON[cid]||'📊';
      return `<div class="cat-wrap">
        <div class="cat-head">
          <span class="cat-icon">${icon}</span>
          <span class="cat-name">${cat.name}</span>
          <span class="cat-count">${cat.stocks.length} 檔</span>
          ${hasAI?`<span class="cat-ai">AI</span>`:''}
          <div class="cat-rule"></div>
        </div>
        <div class="sk-grid">${cat.stocks.map(s=>stockCard(s,aiMap,newsRaw,holdings)).join('')}</div>
      </div>`;
    }).join('');
    if (!hasAI) {
      const n=document.createElement('div');
      n.style.cssText='font-size:.7rem;color:var(--muted);margin:-6px 0 18px;';
      n.textContent='🤖 AI 建議尚未產生（等待下次 Actions 執行）';
      qs('stocks-by-category').prepend(n);
    }
  } catch { qs('stocks-by-category').innerHTML='<div class="muted" style="padding:16px">個股資料載入失敗</div>'; }
}

async function loadNews() {
  try {
    const data = await fetchJSON('data/news/latest.json');
    const c=qs('news-container');
    if(!data.length){c.innerHTML='<div class="news-row muted">暫無新聞</div>';return;}
    c.innerHTML=data.slice(0,12).map(n=>`
      <div class="news-row">
        <a href="${n.link}" target="_blank" class="news-a">${n.title}</a>
        <div class="news-meta">${n.source} · ${n.time}</div>
      </div>`).join('');
  } catch { qs('news-container').innerHTML='<div class="news-row muted">新聞載入失敗</div>'; }
}

async function loadAll() {
  qs('last-update').textContent='更新中…';
  await Promise.all([loadIndices(), loadStocks(), loadNews()]);
  qs('last-update').textContent='更新：'+new Date().toLocaleTimeString('zh-TW',{hour12:false});
  try {
    const stocks=await fetchJSON('data/stocks/latest.json');
    startLiveUpdates(stocks);
  } catch { setBadge(false); }
}

/* ── 跑馬燈 ───────────────────────────────────────────────────── */
let _tickerAnim=null, _tickerOffset=0;

function buildTickerHTML(items){
  const h=items.map(d=>{
    const cls=d.change_pct>0?'up':d.change_pct<0?'down':'muted';
    const arrow=d.change_pct>0?'▲':d.change_pct<0?'▼':'─';
    return `<span class="ticker-item" onclick="openChart('${d.symbol}','${d.name}',${d.price??0})">
      <span class="ticker-name">${d.name}</span>
      <span class="ticker-price ${cls}" data-tprice="${d.symbol}">${d.price?.toLocaleString()??'—'}</span>
      <span class="ticker-chg ${cls}"   data-tchg="${d.symbol}">${arrow}${sign(d.change_pct)}${Math.abs(d.change_pct)}%</span>
    </span>`;
  }).join('');
  return h+h;
}

function startTicker(items){
  const track=qs('ticker-track');
  track.innerHTML=buildTickerHTML(items);
  if(_tickerAnim) cancelAnimationFrame(_tickerAnim);
  _tickerOffset=0;
  function step(){
    _tickerOffset+=0.45;
    const half=track.scrollWidth/2;
    if(_tickerOffset>=half) _tickerOffset=0;
    track.style.transform=`translateX(-${_tickerOffset}px)`;
    _tickerAnim=requestAnimationFrame(step);
  }
  _tickerAnim=requestAnimationFrame(step);
}

function updateTickerPrices(live){
  Object.entries(live).forEach(([sym,d])=>{
    const cls=d.change>0?'up':d.change<0?'down':'muted';
    document.querySelectorAll(`[data-tprice="${sym}"]`).forEach(el=>{
      const np=d.price?.toLocaleString();
      if(el.textContent!==np){
        el.textContent=np; el.className=`ticker-price ${cls}`;
        el.classList.add(d.change>0?'flash-up':'flash-down');
        setTimeout(()=>el.classList.remove('flash-up','flash-down'),600);
      }
    });
    document.querySelectorAll(`[data-tchg="${sym}"]`).forEach(el=>{
      const arrow=d.change>0?'▲':d.change<0?'▼':'─';
      el.textContent=`${arrow}${d.change_pct>0?'+':''}${d.change_pct}%`;
      el.className=`ticker-chg ${cls}`;
    });
  });
}

/* ── 即時報價（TWSE）─────────────────────────────────────────── */
const EXCHANGE_MAP = {
  '2330.TW':'tse','2317.TW':'tse','2382.TW':'tse','2454.TW':'tse',
  '2409.TW':'tse','3481.TW':'tse','1802.TW':'tse','2327.TW':'tse','3231.TW':'tse',
  '2408.TW':'otc','2344.TW':'otc','2337.TW':'otc','6770.TW':'otc',
  '2492.TW':'otc','3026.TW':'otc','6285.TW':'otc','2314.TW':'otc',
  '5388.TW':'otc','6443.TW':'otc','8112.TW':'otc','6669.TW':'otc','6271.TW':'tse',
  '3491.TWO':'otc','3081.TWO':'otc','3234.TWO':'otc','4908.TWO':'otc','6568.TWO':'otc',
};
const INDEX_TWSE={'^ TWII':'tse_t00.tw','^TWOII':'otc_o00.tw'};

function isTWMarketOpen(){
  const tw=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'}));
  const d=tw.getDay();
  if(d===0||d===6) return false;
  const m=tw.getHours()*60+tw.getMinutes();
  return m>=540&&m<811;
}

async function fetchTWSELive(symbols){
  const query=symbols.map(sym=>{
    const ex=EXCHANGE_MAP[sym];
    const code=sym.replace(/\.TWO?$/,'').toLowerCase();
    return ex?`${ex}_${code}.tw`:`tse_${code}.tw|otc_${code}.tw`;
  }).join('|');
  const idxQ=Object.values({'^ TWII':'tse_t00.tw','^TWOII':'otc_o00.tw'}).join('|');
  const resp=await fetch(`https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${query}|${idxQ}&json=1&delay=0`,{cache:'no-store'});
  const data=await resp.json();
  const result={};
  (data.msgArray||[]).forEach(item=>{
    const rawP=item.z?.trim(), rawY=item.y?.trim();
    if(!rawP||rawP==='-') return;
    const price=parseFloat(rawP), prev=parseFloat(rawY);
    if(isNaN(price)||isNaN(prev)) return;
    let key=Object.keys(EXCHANGE_MAP).find(s=>s.replace(/\.TWO?$/,'')===item.c)||(item.c+'.TW');
    if(item.c==='t00') key='^TWII';
    if(item.c==='o00') key='^TWOII';
    result[key]={
      price:Math.round(price*100)/100,
      change:Math.round((price-prev)*100)/100,
      change_pct:Math.round((price-prev)/prev*10000)/100,
    };
  });
  return result;
}

function applyLivePrices(live){
  Object.entries(live).forEach(([sym,d])=>{
    const pe=document.querySelector(`[data-price="${sym}"]`);
    const ce=document.querySelector(`[data-chg="${sym}"]`);
    if(!pe||d.price==null) return;
    const cls=d.change>0?'up':d.change<0?'down':'muted';
    const np=d.price.toLocaleString();
    if(pe.textContent!==np&&pe.textContent!=='—'){
      pe.classList.add(d.change>0?'flash-up':'flash-down');
      setTimeout(()=>pe.classList.remove('flash-up','flash-down'),600);
    }
    pe.className=pe.className.replace(/\b(up|down|muted)\b/g,cls); pe.textContent=np;
    if(ce){
      ce.className=ce.className.replace(/\b(up|down|muted)\b/g,cls);
      const isIdx=sym.startsWith('^');
      ce.textContent=isIdx
        ?`${d.change>0?'+':''}${d.change}（${d.change_pct>0?'+':''}${d.change_pct}%）`
        :`${d.change_pct>0?'+':''}${d.change_pct}%`;
    }
  });
  updateTickerPrices(live);
}

function setBadge(live){
  qs('live-badge').style.display  =live?'inline-block':'none';
  qs('closed-badge').style.display=live?'none':'inline-block';
}

let _liveTimer=null;

async function startLiveUpdates(stocks){
  if(_liveTimer) clearInterval(_liveTimer);
  const items=stocks.filter(s=>s.price!=null)
    .map(s=>({symbol:s.symbol,name:s.name,price:s.price,change_pct:s.change_pct??0}));
  if(items.length) startTicker(items);
  const symbols=stocks.map(s=>s.symbol).filter(Boolean);
  if(!isTWMarketOpen()){setBadge(false);return;}
  setBadge(true);
  const tick=async()=>{
    if(!isTWMarketOpen()){clearInterval(_liveTimer);setBadge(false);return;}
    try{
      const live=await fetchTWSELive(symbols);
      if(Object.keys(live).length){
        applyLivePrices(live);
        qs('last-update').textContent='即時 '+new Date().toLocaleTimeString('zh-TW',{hour12:false});
      }
    }catch(e){console.warn('即時報價失敗',e);}
  };
  await tick();
  _liveTimer=setInterval(tick,30000);
}

/* ── K 線圖 ───────────────────────────────────────────────────── */
let _mainChart=null,_kdChart=null,_currentSym=null,_currentPeriod='daily';

function openChart(symbol,name,price){
  _currentSym=symbol;
  qs('chart-title').textContent=`${name}（${symbol}）`;
  qs('chart-price').textContent=price?`NT$ ${price.toLocaleString()}`:'';
  qs('chart-modal').classList.add('open');
  document.body.style.overflow='hidden';
  renderChart(symbol,'daily');
}
function closeChart(){
  qs('chart-modal').classList.remove('open');
  document.body.style.overflow='';
  if(_mainChart){_mainChart.remove();_mainChart=null;}
  if(_kdChart){_kdChart.remove();_kdChart=null;}
}
function switchPeriod(p){
  _currentPeriod=p;
  qs('btn-daily').className ='btn-period'+(p==='daily'?' active':'');
  qs('btn-weekly').className='btn-period'+(p==='weekly'?' active':'');
  renderChart(_currentSym,p);
}

const CHART_OPTS={
  layout:{background:{color:'#0a0b10'},textColor:'#9994a0'},
  grid:{vertLines:{color:'#181a26'},horzLines:{color:'#181a26'}},
  rightPriceScale:{borderColor:'#1f2235'},
  timeScale:{borderColor:'#1f2235',timeVisible:true},
  crosshair:{mode:1},
};

async function renderChart(symbol,period){
  const mw=qs('main-chart-wrap'),kw=qs('kd-chart-wrap');
  mw.innerHTML='<div style="color:var(--muted);padding:48px;text-align:center;font-size:.8rem">K線圖載入中…</div>';
  kw.innerHTML='';
  if(_mainChart){_mainChart.remove();_mainChart=null;}
  if(_kdChart){_kdChart.remove();_kdChart=null;}
  try {
    const data=await fetchJSON(`data/charts/${symbol}_${period}.json`);
    _mainChart=LightweightCharts.createChart(mw,{...CHART_OPTS,width:mw.clientWidth,height:mw.clientHeight});
    const candle=_mainChart.addCandlestickSeries({
      upColor:'#e05c5c',downColor:'#4db86a',
      borderUpColor:'#e05c5c',borderDownColor:'#4db86a',
      wickUpColor:'#e05c5c',wickDownColor:'#4db86a',
    });
    candle.setData(data.candles);
    [{key:'ma5',color:'#ff9d00',w:2},{key:'ma10',color:'#f5d020',w:2},
     {key:'ma20',color:'#6b97cc',w:2.5},{key:'ma60',color:'#9b8fcc',w:2.5}]
    .forEach(({key,color,w})=>{
      if(data[key]?.length) _mainChart.addLineSeries({color,lineWidth:w,title:key.toUpperCase()}).setData(data[key]);
    });
    if(data.bb_upper?.length){
      _mainChart.addLineSeries({color:'#2c3050',lineWidth:1,lineStyle:2,title:'BB上'}).setData(data.bb_upper);
      _mainChart.addLineSeries({color:'#2c3050',lineWidth:1,lineStyle:0,title:'BB中'}).setData(data.bb_mid);
      _mainChart.addLineSeries({color:'#2c3050',lineWidth:1,lineStyle:2,title:'BB下'}).setData(data.bb_lower);
    }
    if(data.crosses?.length){
      candle.setMarkers(data.crosses.map(c=>({
        time:c.time,size:1,
        position:c.type==='golden'?'belowBar':'aboveBar',
        color:c.type==='golden'?'#c9a84c':'#4e5068',
        shape:c.type==='golden'?'arrowUp':'arrowDown',
        text:c.type==='golden'?'黃金':'死亡',
      })));
    }
    _mainChart.timeScale().fitContent();
    _kdChart=LightweightCharts.createChart(kw,{
      ...CHART_OPTS,width:kw.clientWidth,height:kw.clientHeight,
      rightPriceScale:{...CHART_OPTS.rightPriceScale,scaleMargins:{top:.05,bottom:.05}},
    });
    if(data.kd_k?.length) _kdChart.addLineSeries({color:'#6b97cc',lineWidth:1.5,title:'K'}).setData(data.kd_k);
    if(data.kd_d?.length) _kdChart.addLineSeries({color:'#c9a84c',lineWidth:1.5,title:'D'}).setData(data.kd_d);
    [{value:80,color:'rgba(224,92,92,.3)'},{value:20,color:'rgba(77,184,106,.3)'}].forEach(({value,color})=>{
      const s=_kdChart.addLineSeries({color,lineWidth:1,lineStyle:2,priceLineVisible:false});
      if(data.kd_k?.length) s.setData(data.kd_k.map(p=>({time:p.time,value})));
    });
    _kdChart.timeScale().fitContent();
    _mainChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r)_kdChart.timeScale().setVisibleLogicalRange(r);});
    _kdChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r)_mainChart.timeScale().setVisibleLogicalRange(r);});
  } catch {
    mw.innerHTML=`<div style="color:var(--muted);padding:48px;text-align:center;font-size:.78rem">
      K線圖尚未生成<br><span style="opacity:.6">請至 GitHub Actions 執行「每日更新K線圖資料」</span></div>`;
  }
}

window.addEventListener('resize',()=>{
  if(_mainChart) _mainChart.applyOptions({width:qs('main-chart-wrap').clientWidth});
  if(_kdChart)   _kdChart.applyOptions({width:qs('kd-chart-wrap').clientWidth});
});

loadAll();
setInterval(loadAll, 5*60*1000);
</script>

name: 自動同步股市資料

on:
  schedule:
    - cron: '30 0 * * 1-5'   # 08:30 TST 開盤前
    - cron: '*/5 1-5 * * 1-5' # 09:00-13:55 TST 每5分鐘
    - cron: '0 6 * * 1-5'    # 14:00 TST 收盤後快照
  workflow_dispatch:            # 允許手動觸發

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch stock data
        run: python scripts/fetch_all.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "auto: 更新股市資料 $(TZ='Asia/Taipei' date +'%Y-%m-%d %H:%M') TST"
          git push
